version: '3.8'

services:
  # 1. CÉREBRO: Motor LLM Local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - D:\tech\labs\POC_IA_JARVIS_HRFERRO\ollama_data:/root/.ollama
    restart: unless-stopped
    # Nota para GPU NVIDIA no WSL2/Windows: Descomente se possuir GPU dedicada compatível
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Ativação do uso da GPU NVIDIA via Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ----------------------------------- ## ----------------------------------- #
    # GTX 1650 - Nota dicas de qual modelo utilizar para cada modelo de gpu/placa de vídeo.
    # Opção 1 : Qwen 2.5 de 3B Parâmetros (Excelente raciocínio e suporte ao Português)
    # qwen2.5:3b
    # Opção 2: Llama 3.2 de 3B Parâmetros (Modelo recente e rápido da Meta)
    # ----------------------------------- ## ----------------------------------- #
    # RTX 3060 - Nota dicas de qual modelo utilizar para cada modelo de gpu/placa de vídeo.
    # llama3.2:3b
    # Opção 1: Llama 3.1 de 8B Parâmetros (O modelo mais completo para o projeto Jarvis)
    # docker exec -it jarvis-ollama ollama run llama3.1:8b
    # Opção 2: Qwen 2.5 de 7B Parâmetros (Alta performance para código e instruções complexas)
    # docker exec -it jarvis-ollama ollama run qwen2.5:7b
    # ----------------------------------- ## ----------------------------------- #

  # 2. INTERFACE: Painel Web de Chat (Open WebUI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jarvis-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - D:\tech\labs\POC_IA_JARVIS_HRFERRO\webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - ollama

  # 3. MEMÓRIA: Banco de Dados Vetorial (Qdrant)
  vector-db:
    image: qdrant/qdrant:latest
    container_name: jarvis-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - D:\tech\labs\POC_IA_JARVIS_HRFERRO\qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 4. ÁUDIO: Serviço de Voz (Faster-Whisper / Piper TTS)
  audio-service:
    image: python:3.10-slim
    container_name: jarvis-audio
    command: tail -f /dev/null
    volumes:
      - D:\tech\labs\POC_IA_JARVIS_HRFERRO:/opt/jarvis/workspace
    working_dir: /opt/jarvis/workspace
    restart: unless-stopped

  # 5. ORQUESTRADOR: Agente Python / Automação (Rocky Linux 9)
  agent:
    image: rockylinux:9
    container_name: jarvis-agent
    command: tail -f /dev/null
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://vector-db:6333
    volumes:
      - D:\tech\labs\POC_IA_JARVIS_HRFERRO:/opt/jarvis/workspace
    working_dir: /opt/jarvis/workspace
    depends_on:
      - ollama
      - vector-db
    restart: unless-stopped